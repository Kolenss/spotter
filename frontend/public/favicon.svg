<!-- Spotter tab mark. Drawn rather than traced so it stays crisp at 16px,
     where a raster of this would turn to mush.

     Four dots on the navy ground: one coral above a run of three teals fading
     out. The coral is the same undertone as the app's glow token, and the teals
     are its accent, so the tab reads as the same product as the masthead.

     Geometry is a 32 unit grid: dot pitch 8, radius 3.2, which leaves an even
     4.8 margin left and right and 7.8 top and bottom, so the group sits dead
     centre at 16,16. Every centre lands on a whole or half pixel at 16px, 32px
     and 48px, the three sizes browsers actually rasterise, so no dot picks up a
     soft edge the others do not have.

     Note for editors: no double hyphen may appear anywhere in this comment.
     XML forbids it, and an SVG that fails to parse shows as a blank tab icon
     with no error anywhere. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Spotter">
  <rect width="32" height="32" rx="7" fill="#0d1e2d"/>
  <circle cx="8" cy="11" r="3.2" fill="#f84960"/>
  <circle cx="8" cy="21" r="3.2" fill="#40e0d0"/>
  <circle cx="16" cy="21" r="3.2" fill="#40e0d0" opacity="0.55"/>
  <circle cx="24" cy="21" r="3.2" fill="#40e0d0" opacity="0.28"/>
</svg>
