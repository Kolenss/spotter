# Render blueprint for the Django API. The React frontend stays on Vercel.
#
# Region is oregon deliberately: the Supabase database lives in us-west-2, and
# putting the API in Virginia would add a cross-country hop to every query.
#
# Migrations run in the build command rather than at start-up -- a start-up
# migration would race across instances if this ever scaled past one.
services:
  - type: web
    name: spotter-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    # Render supplies $PORT; binding anything else makes the service unreachable.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      # Generated once by Render and kept; never in the repo.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Leading dot is a Django wildcard, so this covers whatever hostname
      # Render assigns without a second edit.
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      # Secrets and the frontend's origin: set these in the Render dashboard.
      # `sync: false` means "prompt me, don't store it here".
      - key: DATABASE_URL
        sync: false
      - key: ORS_API_KEY
        sync: false
      # The exact Vercel origin, no trailing slash. Without it the browser
      # blocks every request the app makes.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
